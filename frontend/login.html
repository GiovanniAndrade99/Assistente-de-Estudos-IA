<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Assistente de Estudos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="login.css">
  <script>try { document.documentElement.dataset.tema = localStorage.getItem("tema") || "claro"; } catch {}</script>
</head>
<body>
  <div class="pagina-login">
    <!-- Lado esquerdo: decoração (anéis + ícones flutuantes); some em telas estreitas -->
    <section class="lado-visual" aria-hidden="true">
      <span class="anel anel-1"></span>
      <span class="anel anel-2"></span>
      <span class="anel anel-3"></span>

      <span class="badge-flutuante" style="left: 9%; top: 17%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg>
      </span>
      <span class="badge-flutuante" style="right: 8%; top: 23%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
      </span>
      <span class="badge-flutuante" style="left: 12%; bottom: 17%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6.9c0 1.9-2.8 2.7-2.8 2.7"/><path d="M12 16.6h.01"/></svg>
      </span>
      <span class="badge-flutuante" style="right: 10%; bottom: 21%;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="3" rx="1.5"/><rect width="7" height="7" x="14" y="14" rx="1.5"/><rect width="7" height="7" x="3" y="14" rx="1.5"/></svg>
      </span>

      <div class="conteudo-visual">
        <span class="marca-icone">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
        </span>
        <h1>Assistente<br>de Estudos</h1>
        <p>Tire dúvidas, gere resumos, flashcards e simulados a partir dos materiais das suas disciplinas.</p>
      </div>
    </section>

    <!-- Lado direito: formulários -->
    <main class="lado-form">
      <section class="cartao-login">
        <div class="abas-login" role="tablist">
          <button type="button" class="aba-login ativa" data-aba="entrar" role="tab" aria-selected="true">Entrar</button>
          <button type="button" class="aba-login" data-aba="criar" role="tab" aria-selected="false">Criar conta</button>
        </div>

        <form id="form-entrar" novalidate>
          <h2>Bem-vindo de volta</h2>
          <p class="subtitulo">Entre na sua conta para continuar estudando.</p>

          <div class="campo">
            <label for="entrar-email">E-mail</label>
            <input type="email" id="entrar-email" name="email" autocomplete="email"
              placeholder="seu@email.com" data-rotulo="E-mail" required>
            <p class="erro-campo"></p>
          </div>

          <div class="campo">
            <label for="entrar-senha">Senha</label>
            <div class="com-olho">
              <input type="password" id="entrar-senha" name="senha" autocomplete="current-password"
                placeholder="Sua senha" data-rotulo="Senha" required>
              <button type="button" class="olho" aria-label="Mostrar senha"></button>
            </div>
            <p class="erro-campo"></p>
          </div>

          <p class="erro-geral" role="alert"></p>
          <button type="submit" class="botao-entrar">Entrar</button>
        </form>

        <form id="form-cadastrar" novalidate hidden>
          <h2>Crie sua conta</h2>
          <p class="subtitulo">Tire dúvidas, gere resumos, flashcards e simulados das suas disciplinas.</p>

          <div class="campo">
            <label for="cad-nome">Nome</label>
            <input type="text" id="cad-nome" name="nome" autocomplete="name"
              placeholder="Seu nome completo" data-rotulo="Nome" required>
            <p class="erro-campo"></p>
          </div>

          <div class="campo">
            <label for="cad-email">E-mail</label>
            <input type="email" id="cad-email" name="email" autocomplete="email"
              placeholder="seu@email.com" data-rotulo="E-mail" required>
            <p class="erro-campo"></p>
          </div>

          <div class="campo">
            <label for="cad-senha">Senha</label>
            <div class="com-olho">
              <input type="password" id="cad-senha" name="senha" autocomplete="new-password"
                placeholder="Mínimo de 6 caracteres" data-rotulo="Senha" required>
              <button type="button" class="olho" aria-label="Mostrar senha"></button>
            </div>
            <p class="erro-campo"></p>
          </div>

          <div class="campo">
            <span class="rotulo-campo">Eu sou</span>
            <div class="escolha-tipo" role="radiogroup" aria-label="Tipo de conta">
              <label class="pill-tipo"><input type="radio" name="tipo" value="aluno" checked><span>🎓 Aluno</span></label>
              <label class="pill-tipo"><input type="radio" name="tipo" value="professor"><span>👩‍🏫 Professor</span></label>
            </div>
          </div>

          <p class="erro-geral" role="alert"></p>
          <button type="submit" class="botao-entrar">Criar conta</button>
        </form>
      </section>
    </main>
  </div>

  <script src="login.js"></script>
</body>
</html>
